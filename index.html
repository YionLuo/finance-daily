function renderBreakingNews() {
  const container = document.getElementById('breakingSection');
  const tocBreaking = document.getElementById('toc-breaking');

  // Merge finance + AI breaking news
  const allNews = [
    ...breakingNews.map(n => ({...n, _src: 'finance'})),
    ...aiBreakingNews.map(n => ({...n, _src: 'ai'})),
  ];

  // Sort by recency (handle cross-midnight)
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  allNews.sort((a, b) => {
    const [ah, am] = a.time.split(':').map(Number);
    const [bh, bm] = b.time.split(':').map(Number);
    const at = ah * 60 + am;
    const bt = bh * 60 + bm;
    const da = at <= nowMin ? nowMin - at : nowMin - at + 1440;
    const db = bt <= nowMin ? nowMin - bt : nowMin - bt + 1440;
    return da - db;
  });

  if (allNews.length === 0) {
    container.style.display = 'none';
    if (tocBreaking) tocBreaking.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  if (tocBreaking) tocBreaking.style.display = 'block';

  const dateStr = breakingDate || aiBreakingDate || '';

  // Build unique tag list for filters
  const tagSet = new Map();
  allNews.forEach(n => { if (n.tag && n.tagText) tagSet.set(n.tag, n.tagText); });

  // Store allNews globally for filtering
  window._allBreakingNews = allNews;
  window._breakingFilter = 'all';
  window._breakingExpanded = false;

  const INITIAL_COUNT = 8;

  function renderItems() {
    const filter = window._breakingFilter;
    const items = filter === 'all' ? window._allBreakingNews : window._allBreakingNews.filter(n => n.tag === filter);
    const expanded = window._breakingExpanded;
    const showItems = expanded ? items : items.slice(0, INITIAL_COUNT);
    const hasMore = items.length > INITIAL_COUNT;

    document.getElementById('breakingList').innerHTML = showItems.map(item => `
      <li class="breaking-item">
        <span class="breaking-item-time">${item.time}</span>
        <div class="breaking-item-body">
          <div class="breaking-item-text">
            <span class="breaking-item-tag ${item.tag}">${item.tagText}</span>${item.text}
          </div>
          <div class="breaking-item-source">${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${item.source} ↗</a>` : item.source}</div>
        </div>
      </li>
    `).join('');

    const toggleBtn = document.getElementById('breakingToggle');
    if (toggleBtn) {
      if (!hasMore) { toggleBtn.style.display = 'none'; }
      else {
        toggleBtn.style.display = 'block';
        toggleBtn.textContent = expanded ? `收起 ↑` : `展开全部 ${items.length} 条 ↓`;
      }
    }
  }

  container.innerHTML = `
    <div id="sec-breaking">
      <div class="breaking-header">
        <span class="breaking-badge"><span class="dot"></span>BREAKING</span>
        <span class="breaking-time">更新于 ${dateStr}</span>
      </div>
      <div class="breaking-filters">
        <span class="filter-chip active" onclick="filterBreaking('all', this)">全部</span>
        ${Array.from(tagSet).map(([tag, text]) => `<span class="filter-chip" onclick="filterBreaking('${tag}', this)">${text}</span>`).join('')}
      </div>
      <ul class="breaking-list" id="breakingList"></ul>
      <button class="breaking-toggle" id="breakingToggle" onclick="toggleBreaking()"></button>
    </div>`;

  renderItems();

  // Expose functions
  window.filterBreaking = function(tag, el) {
    window._breakingFilter = tag;
    window._breakingExpanded = false;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    renderItems();
  };
  window.toggleBreaking = function() {
    window._breakingExpanded = !window._breakingExpanded;
    renderItems();
  };
}

// ============ Fear & Greed Rendering ============

function getFgColor(score) {
  if (score <= 25) return { cls: 'fg-extreme-fear', bg: 'fg-bg-extreme-fear', stroke: '#dc2626', label: 'Extreme Fear' };
  if (score <= 45) return { cls: 'fg-fear', bg: 'fg-bg-fear', stroke: '#ea580c', label: 'Fear' };
  if (score <= 55) return { cls: 'fg-neutral', bg: 'fg-bg-neutral', stroke: '#ca8a04', label: 'Neutral' };
  if (score <= 75) return { cls: 'fg-greed', bg: 'fg-bg-greed', stroke: '#65a30d', label: 'Greed' };
  return { cls: 'fg-extreme-greed', bg: 'fg-bg-extreme-greed', stroke: '#059669', label: 'Extreme Greed' };
}

function getFgLabelCN(rating) {
  const map = {
    'extreme fear': '极度恐惧',
    'fear': '恐惧',
    'neutral': '中性',
    'greed': '贪婪',
    'extreme greed': '极度贪婪'
  };
  return map[rating] || rating;
}

function renderFearGreed() {
  const container = document.getElementById('fearGreedSection');
  const tocFg = document.getElementById('toc-fg');
  if (!fearGreedData || fearGreedData.score === null) {
    container.style.display = 'none';
    if (tocFg) tocFg.style.display = 'none';
    return;
  }
  container.style.display = 'block';
  if (tocFg) tocFg.style.display = 'block';

  const s = fearGreedData.score;
  const c = getFgColor(s);
  const circ = 314.16;
  const offset = circ - (s / 100) * circ;

  function histItem(label, score) {
    const hc = getFgColor(score);
    return '<div class="fg-hist-item"><div class="fg-hist-label">' + label + '</div><div class="fg-hist-score ' + hc.cls + '">' + Math.round(score) + '</div><div class="fg-hist-rating ' + hc.cls + '">' + getFgLabelCN(hc.label.toLowerCase()) + '</div></div>';
  }

  const ts = new Date(fearGreedData.timestamp);
  const timeStr = ts.getFullYear() + '/' + (ts.getMonth()+1) + '/' + ts.getDate() + ' ' + ts.getHours().toString().padStart(2,'0') + ':' + ts.getMinutes().toString().padStart(2,'0');

  container.innerHTML =
    '<div id="sec-fg">' +
    '<div class="fg-card">' +
    '<div class="fg-gauge">' +
    '<svg viewBox="0 0 120 120"><circle class="fg-gauge-bg" cx="60" cy="60" r="50"/><circle class="fg-gauge-fill" cx="60" cy="60" r="50" stroke="' + c.stroke + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '"/></svg>' +
    '<div class="fg-gauge-score"><div class="fg-score-num ' + c.cls + '">' + Math.round(s) + '</div><div class="fg-score-label ' + c.cls + '">' + getFgLabelCN(fearGreedData.rating) + '</div></div>' +
    '</div>' +
    '<div class="fg-info">' +
    '<div class="fg-title">CNN Fear & Greed Index <span class="fg-badge ' + c.bg + '">' + getFgLabelCN(fearGreedData.rating) + '</span></div>' +
    '<div class="fg-history">' +
    histItem('昨收', fearGreedData.previousClose) +
    histItem('一周前', fearGreedData.previous1Week) +
    histItem('一月前', fearGreedData.previous1Month) +
    histItem('一年前', fearGreedData.previous1Year) +
    '</div>' +
    '<div class="fg-source">数据来源：<a href="https://edition.cnn.com/markets/fear-and-greed" target="_blank" rel="noopener">CNN Business ↗</a> · 更新于 ' + timeStr + '</div>' +
    '</div>' +
    '</div>' +
    '</div>';
}

// ============ Deep Research Rendering ============

function renderLatestResearch() {
  const container = document.getElementById('latestResearchPreview');
  const tocResearch = document.getElementById('toc-research');

  if (!deepResearch || deepResearch.length === 0) {
    container.innerHTML = '';
    if (tocResearch) tocResearch.style.display = 'none';
    return;
  }
  if (tocResearch) tocResearch.style.display = 'block';

  const report = deepResearch[0];

  container.innerHTML = `
    <div class="research-preview" id="sec-research">
      <div class="section-label">今日深度研究</div>
      <div class="research-preview-card" onclick="showArticle('${report.id}')">
        <div class="research-preview-meta">
          <span class="research-label">📊 DEEP RESEARCH</span>
          <span class="date-badge">${report.date} · ${report.weekday}</span>
          <span class="research-read-time">📖 ${report.readTime || '阅读'}</span>
        </div>
        <h2>${report.title}</h2>
        ${report.subtitle ? `<div class="research-preview-subtitle">${report.subtitle}</div>` : ''}
        <p class="research-preview-summary">${report.summary}</p>
        <div class="issue-tags">
          ${(report.tags || []).map(t => `<span class="issue-tag ${t.type}">${t.text}</span>`).join('')}
        </div>
        ${report.relatedTickers && report.relatedTickers.length > 0 ? `
          <div class="related-tickers">
            ${report.relatedTickers.map(t => `<span class="ticker-tag">${t}</span>`).join('')}
          </div>
        ` : ''}
      </div>
    </div>`;
}

function renderResearchArticle(reportId) {
  const report = deepResearch.find(r => r.id === reportId);
  if (!report) return;

  // Header
  document.getElementById('articleHeaderContent').innerHTML = `
    <div class="research-preview-meta">
      <span class="research-label">📊 DEEP RESEARCH</span>
      <span class="date-badge">${report.date} · ${report.weekday}</span>
      <span class="research-read-time">📖 ${report.readTime || '阅读'}</span>
    </div>
    <h1>${report.title}</h1>
    ${report.subtitle ? `<div style="font-size:16px;color:var(--text-secondary);margin-bottom:16px;line-height:1.6;">${report.subtitle}</div>` : ''}
    <div class="issue-tags" style="margin-bottom:8px;">
      ${(report.tags || []).map(t => `<span class="issue-tag ${t.type}">${t.text}</span>`).join('')}
    </div>
    ${report.relatedTickers && report.relatedTickers.length > 0 ? `
      <div class="related-tickers">
        ${report.relatedTickers.map(t => `<span class="ticker-tag">${t}</span>`).join('')}
      </div>
    ` : ''}
  `;

  // Build article body
  let html = '';

  // Key Takeaways
  if (report.keyTakeaways && report.keyTakeaways.length > 0) {
    html += `<div class="key-takeaways">
      <h3>🎯 核心要点</h3>
      <ul>${report.keyTakeaways.map(t => `<li>${t}</li>`).join('')}</ul>
    </div>`;
  }

  // Sections
  (report.sections || []).forEach(sec => {
    // Wrap <table> in scrollable container for mobile
    let content = sec.content || '';
    content = content.replace(/<table/g, '<div class="table-scroll-wrapper"><table');
    content = content.replace(/<\/table>/g, '</table></div>');
    html += `<div class="research-section" id="${sec.id || ''}">
      <h2 class="research-section-title">${sec.title}</h2>
      <div class="research-section-content">${content}</div>
    </div>`;
  });

  // Sources
  if (report.sources && report.sources.length > 0) {
    html += `<div class="sources-section">
      <h3>📚 参考来源</h3>
      <ul class="source-list">
        ${report.sources.map((s, i) => `
          <li>
            <span class="source-num">[${i + 1}]</span>
            <div>
              ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.title} ↗</a>` : s.title}
              ${s.publisher ? `<span class="source-publisher"> — ${s.publisher}</span>` : ''}
            </div>
          </li>
        `).join('')}
      </ul>
    </div>`;
  }

  // Topic reason
  if (report.topicReason) {
    html += `<div style="margin-top:24px;padding:16px 20px;background:var(--code-bg);border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);">
      <strong>📝 选题理由：</strong>${report.topicReason}
    </div>`;
  }

  // Disclaimer
  html += `<div class="disclaimer">
    <strong>⚖️ 免责声明：</strong>本报告仅提供资讯聚合与逻辑推演，不构成任何买入、卖出或持有的投资建议。所有信息来源于公开渠道，投资者应独立判断并自行承担风险。
    <div class="generated-at">报告生成时间：${report.generatedAt}</div>
  </div>`;

  document.getElementById('articleBody').innerHTML = html;

  // Build article TOC
  const tocList = document.getElementById('articleTocList');
  if (tocList) {
    let tocHtml = '';
    if (report.keyTakeaways && report.keyTakeaways.length > 0) {
      tocHtml += '<li><a class="toc-link" onclick="scrollToSection(\'key-takeaways\')">核心要点</a></li>';
    }
    (report.sections || []).forEach(sec => {
      if (sec.id) {
        tocHtml += `<li><a class="toc-link" data-section="${sec.id}" onclick="scrollToSection('${sec.id}')">${sec.title}</a></li>`;
      }
    });
    tocList.innerHTML = tocHtml;
  }
}

function renderIssueList() {
  const list = document.getElementById('issueList');
  const count = document.getElementById('issueCount');
  const archive = document.getElementById('archiveSection');
  const tocArchive = document.getElementById('toc-archive');

  const pastReports = deepResearch.slice(1);

  if (pastReports.length === 0) {
    archive.style.display = 'none';
    if (tocArchive) tocArchive.style.display = 'none';
    return;
  }

  archive.style.display = 'block';
  if (tocArchive) tocArchive.style.display = 'block';
  count.textContent = `共 ${pastReports.length} 期`;

  list.innerHTML = pastReports.map(report => `
    <div class="issue-card" onclick="showArticle('${report.id}')">
      <div class="issue-card-top">
        <span class="issue-date">${report.date}</span>
        <span class="issue-weekday">${report.weekday}</span>
        <span class="research-read-time" style="margin-left:auto;">📖 ${report.readTime || ''}</span>
      </div>
      <h3>${report.title}</h3>
      <p class="issue-summary">${report.summary}</p>
      <div class="issue-tags">
        ${(report.tags || []).map(t => `<span class="issue-tag ${t.type}">${t.text}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

// ============ Navigation ============

function showHome() {
  document.getElementById('homePage').classList.add('active');
  document.getElementById('articlePage').classList.remove('active');
  window.scrollTo(0, 0);
  history.pushState(null, '', '#');
}

function showArticle(id) {
  renderResearchArticle(id);
  document.getElementById('homePage').classList.remove('active');
  document.getElementById('articlePage').classList.add('active');
  window.scrollTo(0, 0);
  history.pushState(null, '', '#' + id);
}

function showAbout() {
  alert('Y Daily · 每日深度研究\n\n每日从全球头条精选一个专题，进行深度分析研究。\n\n更新频率：每日 22:00\n数据来源：公开渠道');
}

// Handle back button
window.addEventListener('popstate', () => {
  const hash = location.hash.replace('#', '');
  if (hash && deepResearch.find(r => r.id === hash)) {
    showArticle(hash);
  } else {
    showHome();
  }
});

// ============ Init ============
renderBreakingNews();
renderFearGreed();
renderLatestResearch();
renderIssueList();

// TOC scroll spy
function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) {
    const top = el.getBoundingClientRect().top + window.scrollY - 80;
    window.scrollTo({ top, behavior: 'smooth' });
  }
}

function updateTocHighlight() {
  // Home page TOC
  const homeSections = ['sec-breaking', 'sec-fg', 'sec-research', 'sec-archive'];
  const homeLinks = document.querySelectorAll('#tocList .toc-link');
  let homeCurrent = homeSections[0];
  for (const id of homeSections) {
    const el = document.getElementById(id);
    if (el && el.offsetParent !== null) {
      const rect = el.getBoundingClientRect();
      if (rect.top <= 120) homeCurrent = id;
    }
  }
  homeLinks.forEach(link => { link.classList.toggle('active', link.dataset.section === homeCurrent); });

  // Article page TOC
  const articleLinks = document.querySelectorAll('#articleTocList .toc-link');
  if (articleLinks.length > 0) {
    let articleCurrent = '';
    articleLinks.forEach(link => {
      const secId = link.dataset.section;
      if (secId) {
        const el = document.getElementById(secId);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= 120) articleCurrent = secId;
        }
      }
    });
    articleLinks.forEach(link => {
      link.classList.toggle('active', link.dataset.section === articleCurrent);
    });
  }
}

window.addEventListener('scroll', updateTocHighlight, { passive: true });

// Check hash on load
const initHash = location.hash.replace('#', '');
if (initHash && deepResearch.find(r => r.id === initHash)) {
  showArticle(initHash);
}
</script>
