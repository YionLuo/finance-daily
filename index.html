<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y Daily · 每日深度研究</title>
<meta name="description" content="每日从全球头条精选一个专题，进行深度分析研究。金融 · 科技 · 地缘 · 宏观。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --green: #059669;
    --green-bg: #ecfdf5;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --orange: #d97706;
    --orange-bg: #fffbeb;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --code-bg: #f1f5f9;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ============ Module Tabs ============ */
  .module-tabs {
    display: flex;
    gap: 4px;
    background: var(--code-bg);
    border-radius: 10px;
    padding: 3px;
  }

  .module-tab {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: none;
    white-space: nowrap;
  }

  .module-tab:hover { color: var(--text); }

  .module-tab.active {
    color: var(--accent);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .module-page { display: none; }
  .module-page.active { display: block; }

  /* ============ Navigation ============ */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250,250,250,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .navbar-inner {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 16px;
  }

  .navbar-brand .brand-name {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.3px;
  }

  .navbar-brand .logo-img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  .navbar-links {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .nav-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    transition: all 0.15s;
    cursor: pointer;
  }

  .nav-link:hover, .nav-link.active {
    color: var(--accent);
    background: var(--accent-light);
  }

  /* ============ Layout ============ */
  .page {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .page-with-sidebar {
    display: flex;
    gap: 48px;
    align-items: flex-start;
  }

  .sidebar {
    position: sticky;
    top: 72px;
    width: 180px;
    flex-shrink: 0;
    padding-top: 8px;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }

  .toc-list {
    list-style: none;
    padding: 0;
  }

  .toc-list li {
    margin-bottom: 2px;
  }

  .toc-link {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    cursor: pointer;
  }

  .toc-link:hover {
    color: var(--text);
    background: var(--code-bg);
  }

  .toc-link.active {
    color: var(--accent);
    background: var(--accent-light);
    border-left-color: var(--accent);
    font-weight: 600;
  }

  .main-content {
    flex: 1;
    min-width: 0;
    max-width: 760px;
  }

  /* ============ Breaking News ============ */
  .breaking-section {
    margin-bottom: 40px;
  }

  .breaking-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .breaking-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #fff;
    background: var(--red);
    padding: 4px 12px;
    border-radius: 4px;
    animation: pulse-badge 2s ease-in-out infinite;
  }

  .breaking-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes pulse-badge {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.3); }
    50% { box-shadow: 0 0 0 6px rgba(220,38,38,0); }
  }

  .breaking-time {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .breaking-list {
    list-style: none;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }

  .breaking-item {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-light);
    transition: background 0.15s;
  }

  .breaking-item:last-child {
    border-bottom: none;
  }

  .breaking-item:hover {
    background: var(--code-bg);
  }

  .breaking-item-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    white-space: nowrap;
    padding-top: 2px;
    min-width: 42px;
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .breaking-item-body {
    flex: 1;
    min-width: 0;
  }

  .breaking-item-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: 1px;
  }

  .breaking-item-tag.geo { background: #fef2f2; color: var(--red); }
  .breaking-item-tag.macro { background: #ecfdf5; color: var(--green); }
  .breaking-item-tag.ai { background: #eff6ff; color: var(--accent); }
  .breaking-item-tag.tech { background: #f5f3ff; color: #7c3aed; }
  .breaking-item-tag.crypto { background: var(--orange-bg); color: var(--orange); }

  .breaking-item-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .breaking-item-source {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }

  .breaking-item-source a,
  .source-link {
    color: var(--text-tertiary);
    text-decoration: none;
    transition: color 0.15s;
  }

  .breaking-item-source a:hover,
  .source-link:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .news-source {
    display: inline-block;
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 6px;
  }

  .news-source a {
    color: var(--text-tertiary);
    text-decoration: none;
    transition: color 0.15s;
  }

  .news-source a:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  /* ============ Hero (Compact) ============ */
  .hero-compact {
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .hero-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Latest issue inline header */
  .latest-header {
    margin-bottom: 32px;
  }

  .latest-header .date-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .latest-header h2 {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }

  .latest-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Archive section */
  .archive-section {
    margin-top: 56px;
    padding-top: 32px;
    border-top: 2px solid var(--border);
  }

  /* ============ Issue List ============ */
  .issues-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .issues-header h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .issues-count {
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .issue-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
  }

  .issue-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .issue-card-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .issue-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.3px;
  }

  .issue-weekday {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .issue-card h3 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }

  .issue-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .issue-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .issue-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--code-bg);
    color: var(--text-secondary);
  }

  .issue-tag.up { background: var(--red-bg); color: var(--red); }
  .issue-tag.down { background: var(--green-bg); color: var(--green); }
  .issue-tag.warn { background: var(--orange-bg); color: var(--orange); }

  /* ============ Article Page ============ */
  .article-page { display: none; }
  .article-page.active { display: block; }
  .home-page.active { display: block; }
  .home-page { display: none; }

  .article-header {
    padding: 48px 0 32px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 24px;
    padding: 6px 0;
    cursor: pointer;
    transition: color 0.15s;
  }

  .back-link:hover { color: var(--accent); }

  .article-header .date-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .article-header h1 {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
  }

  .article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .article-meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .watchlist-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
  }

  .tag {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: var(--radius-xs);
    background: var(--code-bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  /* Article body */
  .article-body section { margin-bottom: 48px; }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Briefing cards */
  .briefing-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 12px;
    transition: box-shadow 0.2s;
  }

  .briefing-card:hover { box-shadow: var(--shadow-sm); }

  .briefing-card p { font-size: 15px; line-height: 1.7; }

  .briefing-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: var(--radius-xs);
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    margin-right: 10px;
    flex-shrink: 0;
    vertical-align: middle;
  }

  /* Macro event */
  .macro-event {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .macro-event h3 {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 17px;
    font-weight: 700;
  }

  .event-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    font-size: 16px;
    flex-shrink: 0;
  }

  .fact-block {
    background: var(--code-bg);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1.75;
  }

  .fact-block .label, .assessment .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .mapping-list {
    list-style: none;
    padding: 0;
  }

  .mapping-list li {
    padding: 8px 0;
    font-size: 14px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
  }

  .mapping-list li:last-child { border-bottom: none; }

  .badge-bull {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--green-bg);
    color: var(--green);
    margin-right: 6px;
  }

  .badge-bear {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--red-bg);
    color: var(--red);
    margin-right: 6px;
  }

  /* Stock cards */
  .stock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .stock-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 0;
  }

  .stock-header h3 { margin: 0; font-size: 18px; font-weight: 700; }

  .stock-code {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--code-bg);
    padding: 4px 10px;
    border-radius: var(--radius-xs);
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .stock-body { padding: 16px 24px 24px; }

  .news-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .news-item:last-of-type { border-bottom: none; }

  .news-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .news-content {
    font-size: 14px;
    line-height: 1.7;
  }

  .news-content ul {
    padding-left: 18px;
    margin-top: 6px;
  }

  .news-content li {
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 4px;
  }

  .assessment {
    margin-top: 16px;
    padding: 16px 20px;
    background: var(--orange-bg);
    border-radius: var(--radius-sm);
    font-size: 14px;
    line-height: 1.7;
    border-left: 3px solid var(--orange);
  }

  .assessment .label { color: var(--orange); }

  /* Alert cards (mobile-friendly) */
  .alert-list {
    list-style: none;
    padding: 0;
  }

  .alert-item {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }

  .alert-item:last-child { border-bottom: none; }

  .alert-item-time {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 3px 10px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1.5;
    min-width: 72px;
    text-align: center;
    box-sizing: border-box;
  }

  .alert-item-body {
    flex: 1;
    min-width: 0;
  }

  .alert-item-event {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 4px;
  }

  .alert-item-target {
    font-size: 12px;
    font-family: "SF Mono", "Fira Code", monospace;
    color: var(--text-tertiary);
  }

  /* Data */
  .data {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 13px;
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .up { color: var(--red); }
  .down { color: var(--green); }

  /* Disclaimer */
  .disclaimer {
    margin-top: 56px;
    padding: 24px;
    border-radius: var(--radius-sm);
    background: var(--code-bg);
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  .generated-at {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-tertiary);
    font-style: italic;
  }

  /* ============ Fear & Greed Index ============ */
  .fg-section {
    margin-bottom: 32px;
  }

  .fg-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .fg-gauge {
    position: relative;
    width: 120px;
    height: 120px;
    flex-shrink: 0;
  }

  .fg-gauge svg {
    width: 120px;
    height: 120px;
    transform: rotate(-90deg);
  }

  .fg-gauge-bg {
    fill: none;
    stroke: var(--border-light);
    stroke-width: 8;
  }

  .fg-gauge-fill {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s ease, stroke 0.5s ease;
  }

  .fg-gauge-score {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .fg-score-num {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
  }

  .fg-score-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;

for-ai/" }], application: [{ icon: "🤖", iconBg: "#FFF3E0", title: "ChatGPT接入DoorDash、Spotify、Uber等应用", detail: "TechCrunch发布使用指南，介绍如何在ChatGPT中直接使用Spotify、Canva、Figma、Expedia以及DoorDash、Uber等应用能力。", impact: "大模型平台正向\"超级入口\"演进，智能体的产品形态从单轮对话迈向跨服务任务执行。", source: "TechCrunch", url: "https://techcrunch.com/2026/04/06/how-to-use-chatgpt-apps-doordash-spotify-uber/" }, { icon: "🎵", iconBg: "#FCE4EC", title: "Suno版权争议暴露生成式音乐商用风险", detail: "The Verge指出，AI音乐平台Suno虽宣称不允许使用受版权保护内容，但在音乐翻唱与模仿边界上仍引发严重争议。", impact: "生成式音频工具的合规与版权成本上升，企业采购与创作者使用将更谨慎。", source: "The Verge", url: "https://www.theverge.com/ai-artificial-intelligence/906896/sunos-copyright-ai-music-covers" }, { icon: "⚠️", iconBg: "#FFF8E1", title: "微软条款称Copilot\"仅供娱乐参考\"", detail: "TechCrunch援引微软服务条款指出，Copilot被标注为\"for entertainment purposes only\"，再次反映模型输出可靠性与责任划分问题。", impact: "AI办公与AI Coding类助手的企业部署仍需加入审核、人类复核与风控机制。", source: "TechCrunch", url: "https://techcrunch.com/2026/04/05/copilot-is-for-entertainment-purposes-only-according-to-microsofts-terms-of-service/" }], industry: [{ icon: "🧠", iconBg: "#EDE7F6", title: "微软Maia 200被指挑战NVIDIA数据中心地位", detail: "Google News聚合报道称，微软Maia 200 AI芯片正向NVIDIA在数据中心的优势发起挑战，凸显云厂商自研AI芯片趋势延续。", impact: "算力产业链进入\"GPU+ASIC\"并行竞争阶段，云平台将争夺模型训练与推理成本主导权。", source: "조선일보", url: "https://news.google.com/rss/articles/CBMiiAFBVV95cUxPejJfLWgyb3RsdEhaMFg2Q2R4TG9zS2RjR2V3bHNUbEFXN1ZYYU1aMlVvQ3NXdi1QTGlURDY3M0V6NG5QZ2xQSXZCM0xKNU9qMnVLQmhzNXBaUDZkSFBDdWRwOFpvVmJpaGlUWExfeGNzdWdGek1TNHp2VTE0UWNqRzlVcnJGVUlH?oc=5" }, { icon: "📦", iconBg: "#FBE9E7", title: "NVIDIA AI繁荣面临台湾供应链风险", detail: "Benzinga报道指出，NVIDIA的AI增长故事受到台湾供应链风险牵动，而台积电等关键制造节点的重要性进一步上升。", impact: "AI基础设施的最大不确定性之一仍在供应链，相关风险会影响交付、估值与下游部署节奏。", source: "Benzinga", url: "https://news.google.com/rss/articles/CBMitAFBVV95cUxNMVM4SVc0ZFByMXJKMkwtSlBtTXIzQWwxN0RCZFB5OGUwNS05Mmc2NGZ3bDQ1ZklQSHFnNGtJbW5pVUFZZHNiNVBrb21SVmd6d1JWaURQb0FrLUFXWjdPeWl0d2FLTkhlN3FNWkVhaHk2V0FUWmtHRXF4QnNxeS15RjlDTDVUa1F4aWhjQjNxMXpqZk1WMlJiSnFtZFp0Z08yZ1F5RkpiVmwteWNIYloySFhQNjc?oc=5" }, { icon: "💰", iconBg: "#E8F0FE", title: "北美Q1融资创纪录，AI投融资环境偏暖", detail: "Crunchbase News称，北美2026年第一季度融资在各阶段全面上升并达到纪录水平。虽非纯AI报道，但对AI初创融资环境具有直接指向意义。", impact: "资本市场风险偏好回暖，有利于大模型应用层、AI工具链与AI for Science公司继续融资。", source: "Crunchbase News", url: "https://news.google.com/rss/articles/CBMikAFBVV95cUxNMWhWQy1iZFlCWG5fRjNyR3pkZ25vdUI2WlVMMDExbjZiVkY1Q0c0Si1iMHpoNEZ6RTd6aUF2cmhUSU1qRXJHMVgySV9pQUpqclFhb0NkY2VrREZ3bGhaalQ0NWpzN0lLUVU5cnZ1a3czanZfY2doMUNGaWViTWxjZEF3d3YwTEJsdDY0NkoxbUY?oc=5" }], outlook: [{ time: "未来1-2周", event: "关注ChatGPT应用集成是否继续扩展到更多生产力与生活服务平台", focus: "大模型 / 智能体" }, { time: "未来1个月", event: "观察微软Maia 200与NVIDIA在数据中心侧的实际部署与客户采用情况", focus: "算力基础设施" }, { time: "未来1个月", event: "跟踪台湾供应链风险是否影响GPU、先进封装与AI服务器交付节奏", focus: "产业链" }, { time: "未来1-3个月", event: "关注神经符号AI\"100倍节能\"成果是否出现更多论文复现与产业验证", focus: "AI for Science" }, { time: "未来1-3个月", event: "观察Xoople在1.3亿美元融资后，地球观测数据如何与AI模型形成商业闭环", focus: "AI for Science / 空间智能" }, { time: "未来1-3个月", event: "生成式音乐平台的版权规则与平台责任界定可能继续收紧", focus: "AI应用合规" }] },
  { id: "ai-2026-04-05", date: "2026年4月5日", weekday: "周日", title: "日本具身智能落地，AI助手与收费争议升温", summary: "日本机器人加速补位缺工岗位，Google与Anthropic分别在智能体体验和AI Coding商业化上推进。", tags: [{ text: "具身智能落地", type: "up" }, { text: "地图智能体试水", type: "up" }, { text: "AI Coding加价", type: "warn" }, { text: "聊天机器人谄媚风险", type: "warn" }, { text: "AI版权乱象", type: "down" }], focusAreas: "大模型 · 智能体 · 具身智能 · AI Coding · AI for Science", timeRange: "2026.04.04 – 2026.04.05", generatedAt: "2026年4月5日 22:49 CST", briefings: ["<span class=\"briefing-number\">1</span><strong>具身智能从试点走向部署</strong>：TechCrunch 报道指出，日本在劳动力短缺压力下，正把\"实验性物理 AI\"推进到真实工作场景。核心信号不是机器人替代高意愿岗位，而是优先填补\"没人愿意做\"的缺口岗位，这意味着具身智能商业化正在从演示验证转向刚需落地。", "<span class=\"briefing-number\">2</span><strong>消费级智能体体验继续前移</strong>：The Verge 体验显示，Gemini 已能够在 Google Maps 中承担\"规划一天行程\"的任务，且实际表现\"出乎意料地好\"。这说明大模型能力正在更深嵌入高频工具，地图、搜索、邮件等入口正成为智能体竞争的关键分发层。", "<span class=\"briefing-number\">3</span><strong>AI 产业进入\"收费更细、风险更显\"阶段</strong>：Anthropic 宣布 Claude Code 订阅用户使用 OpenClaw 等第三方工具将需额外付费，反映 AI Coding 正走向更精细化商业模式。与此同时，关于聊天机器人\"谄媚\"倾向、音乐人遭遇 AI 伪作与版权骚扰等报道，也提醒行业治理问题正在同步抬头。"], research: [{ icon: "🤖", iconBg: "#E8F5E9", title: "日本验证物理 AI 的现实部署可行性", detail: "报道显示，日本因长期劳动力短缺，正推动机器人与物理 AI 从试点阶段进入真实工作环境。其落地方向并非传统\"机器替人\"，而是优先覆盖高缺工、低意愿岗位，成为具身智能商业验证的重要样本。", impact: "对具身智能赛道是积极信号：需求端由\"可选效率工具\"转向\"刚性劳动力补充\"，将提升机器人系统、感知控制与部署服务的商业确定性。", source: "TechCrunch", url: "https://techcrunch.com/2026/04/05/japan-is-proving-experimental-physical-ai-is-ready-for-the-real-world/" }, { icon: "🧠", iconBg: "#E3F2FD", title: "研究提示主流聊天机器人存在\"谄媚\"倾向", detail: "一项被 Google News 收录的报道提到，领先 AI 聊天机器人会表现出\"flattery（谄媚）\"，可能影响用户判断。这类迎合式反馈若持续存在，可能削弱模型在教育、医疗建议、决策辅助等场景中的中立性与可信度。", impact: "这为大模型对齐与评估提出新要求：不仅要降低幻觉，还要抑制过度迎合用户的行为偏差，避免形成\"听起来舒服但未必正确\"的输出模式。", source: "bgnes.com / Google News", url: "https://news.google.com/rss/articles/CBMirgFBVV95cUxOOC1teGRaVjU4S1c5aDBpVHMzT3ZBZXFkdlR1N1RHdzl4VHYyc1R3ZHB0VzdxMVlzNzhKQ2tHVTRVQ0Rwa01YaktqdVowZ0lBWkxoN3I2bk9mdUEzOWVWLXp1Ukg1ZFlYZ3RTQnhldU0yMm5tY0tfd2ZtU0dCSTQyZGptWWtqU2Y1Vmo2T1c1S0dxWjdCdndBcGk4eDRGbFhOWkliOHBIS3ZGcU4ybEE?oc=5" }], application: [{ icon: "🗺️", iconBg: "#FFF3E0", title: "Gemini 在 Google Maps 中承担日程规划任务", detail: "The Verge 的上手体验显示，Gemini 已被整合进 Google Maps，可直接帮助用户规划一天行程，而且整体效果\"出乎意料地好\"。这代表地图产品正在从导航工具升级为任务型智能体入口。", impact: "对 Google 而言，这种原生集成比独立聊天入口更接近真实使用场景；对行业而言，说明智能体价值正通过现有超级 App 被快速验证。", source: "The Verge", url: "https://www.theverge.com/tech/907015/gemini-google-maps-hands-on" }, { icon: "💻", iconBg: "#F3E5F5", title: "Claude Code 与第三方工具联动将额外收费", detail: "TechCrunch 报道称，Anthropic 表示 Claude Code 订阅用户若要使用 OpenClaw 及其他第三方工具支持，将需要支付额外费用。", impact: "这说明 AI Coding 正从\"统一订阅\"转向按能力与生态连接分层收费。对开发者来说，成本结构会更复杂；对平台来说，外部工具编排能力正在成为可单独定价的增值项。", source: "TechCrunch", url: "https://techcrunch.com/2026/04/04/anthropic-says-claude-code-subscribers-will-need-to-pay-extra-for-openclaw-support/" }], industry: [{ icon: "⚖️", iconBg: "#FFEBEE", title: "音乐人遭遇 AI 伪作与版权骚扰", detail: "The Verge 报道，一位民谣音乐人发现其 Spotify 页面出现并非本人上传的歌曲，事件同时牵涉 AI 伪造内容与版权流氓问题，反映音乐平台在身份核验、内容溯源与版权申诉链路上的脆弱性。", impact: "生成式 AI 扩大了低成本伪作与冒名分发风险，平台和版权体系将面临更大的审核与追责压力，也会影响创作者对数字分发渠道的信任。", source: "The Verge", url: "https://www.theverge.com/entertainment/907111/murphy-campbell-folk-music-ai-copyright" }, { icon: "📝", iconBg: "#EDE7F6", title: "Grammarly 再陷 AI 产品与评审争议讨论", detail: "The Verge 的专栏回顾了 Grammarly 相关的\"sloppelganger saga\"，将其作为 AI 产品演进与评价体系失衡的代表性案例之一，折射出市场对 AI 助手质量、真实性与营销叙事之间张力的持续关注。", impact: "行业层面，这类事件会继续推动对 AI 产品测评标准、输出质量控制以及\"是否真正提升生产力\"的更严格审视。", source: "The Verge", url: "https://www.theverge.com/column/906606/grammarly-expert-review-ai-saga" }, { icon: "🏭", iconBg: "#E0F7FA", title: "日本缺工压力推动机器人产业需求外溢", detail: "日本将机器人视为补充劳动力的一线方案，而非远期概念。这种需求驱动的部署逻辑，有望带动硬件、系统集成、运维服务与行业软件一体化协同。", impact: "对全球机器人与具身智能公司而言，日本可能成为最重要的现实验证市场之一，产业链合作与场景定制会比单纯模型能力更关键。", source: "TechCrunch", url: "https://techcrunch.com/2026/04/05/japan-is-proving-experimental-physical-ai-is-ready-for-the-real-world/" }], outlook: [{ time: "未来1-3个月", event: "更多高频入口产品将测试\"任务规划型\"智能体体验", focus: "智能体" }, { time: "未来1个季度", event: "Claude Code 等开发者产品可能持续细化第三方工具调用与高级功能定价", focus: "AI Coding" }, { time: "未来1个季度", event: "围绕聊天机器人\"谄媚\"倾向的模型评测与安全讨论将继续升温", focus: "大模型" }, { time: "未来6个月", event: "日本等老龄化市场有望成为具身智能商业部署的先行观察样本", focus: "具身智能" }, { time: "未来6个月", event: "音乐与内容平台可能强化 AI 伪作识别、身份校验和版权申诉机制", focus: "行业治理" }] },

, title: "AI资本开支未熄火，云与半导体链条继续受关注", fact: "Goldman认为微软有望反弹，核心在AI融入365；Oracle在\"大规模AI云建设\"中更换CFO；TSM被讨论为\"被低估的AI股\"，说明企业AI与算力投资仍是主线。", source: "CNBC / IBD / Yahoo Finance", url: "https://www.cnbc.com/2026/04/06/goldman-expects-a-rebound-for-mag-7-underperformer-microsoft.html", mappings: [{ type: "bull", text: "<strong>台积电 TSM</strong> — AI需求叙事延续，有利先进制程与高性能计算代工需求。" }, { type: "bear", text: "<strong>AMZN</strong> — 若云基础设施竞争加剧，资本开支回报与利润率会继续被市场审视。" }] }], stocks: [{ name: "🪟 微软", code: "MSFT", news: [{ label: "📰 高盛看好微软反弹", content: "CNBC报道，微软是今年表现最差的Mag 7股票，但高盛认为其将受益于AI融入365产品，存在上行空间。", source: "CNBC", url: "https://www.cnbc.com/2026/04/06/goldman-expects-a-rebound-for-mag-7-underperformer-microsoft.html" }], assessment: "<strong>解读：</strong>这条新闻强化了<strong>企业AI商业化</strong>而非单纯模型叙事。若宏观波动加大、市场偏向高质量现金流资产，微软在云+办公软件+AI增购上的确定性相对更强，属于当前科技防御中的进攻品种。" }, { name: "🔎 Alphabet", code: "GOOGL", news: [{ label: "📰 股价自2月中旬大跌后，市场讨论期权式反弹交易", content: "CNBC指出，Alphabet自2月中旬以来显著回落，节目嘉宾给出看多反弹的期权组合思路，反映资金开始博弈阶段性修复。", source: "CNBC", url: "https://www.cnbc.com/2026/04/06/alphabet-has-fallen-sharply-since-mid-february-trading-a-potential-comeback-with-options.html" }], assessment: "<strong>解读：</strong>新闻本身不是基本面催化，而是<strong>情绪与仓位</strong>信号。若中东风险缓和、利率预期稳定，大盘科技中的落后品种更容易出现估值修复；但若油价再冲高，广告与云业务的盈利预期也会被重新下调。" }, { name: "🍿 奈飞", code: "NFLX", news: [{ label: "📰 财报前获上调至买入", content: "IBD报道，Netflix在财报前被上调至\"买入\"，显示市场对其业绩兑现与订阅表现抱有更高期待。", source: "Investor's Business Daily", url: "https://www.investors.com/news/technology/netflix-stock-upgraded-to-buy-goldman-sachs/?src=A00220&yptr=yahoo" }], assessment: "<strong>解读：</strong>虽然不在核心观察名单，但对美股成长风格有参考意义。若财报季中线上娱乐继续展现韧性，说明消费互联网仍能在油价冲击与宏观不确定中维持相对稳定的需求。" }, { name: "🗄️ 甲骨文", code: "ORCL", news: [{ label: "📰 大规模AI云建设中更换CFO", content: "IBD称，Oracle在推进大规模AI云基础设施建设之际任命新CFO，市场关注其扩张节奏与资本配置效率。", source: "Investor's Business Daily", url: "https://www.investors.com/news/technology/oracle-stock-orcl-cfo-maxson/?src=A00220&yptr=yahoo" }], assessment: "<strong>解读：</strong>管理层变   { id: "2026-04-03", date: "2026年4月3日", weekday: "周五", title: "非农超预期叠加伊朗战事压制风险偏好", summary: "3月非农新增17.8万高于预期，降息预期再受扰动；中东冲突推升油价与利率，科技与加密承压。", tags: [{ text: "恐惧贪婪 19.31", type: "warn" }, { text: "非农 17.8万", type: "up" }, { text: "失业率 4.3%", type: "up" }, { text: "国债收益率走高", type: "warn" }, { text: "比特币走弱", type: "down" }], watchlist: ["腾讯 0700", "阿里 9988", "小鹏 XPEV", "美团 3690", "小米 1810", "AAPL", "MSFT", "GOOGL", "AMZN", "NVDA"], focusAreas: "AI与大模型 · 半导体与算力 · 中美科技博弈 · 云计算与企业AI · 智能驾驶与机器人 · 科技监管与反垄断 · 宏观与流动性", timeRange: "2026.04.02 – 2026.04.03", generatedAt: "2026年4月3日 22:40 CST", briefings: ["<span class=\"briefing-number\">1</span><strong>宏观主线：就业强于预期，降息博弈再延后。</strong>美国3月非农新增就业<span class=\"data up\">17.8万</span>，明显高于预期的<span class=\"data up\">5.9万</span>；失业率降至<span class=\"data up\">4.3%</span>。数据公布后，报道指出美债收益率上行、股指期货与比特币回落，市场对美联储尽快降息的押注进一步受压，成长股估值锚继续承受折现率抬升冲击。", "<span class=\"briefing-number\">2</span><strong>地缘与能源：伊朗战事持续升级，全球风险溢价抬升。</strong>特朗普威胁打击伊朗基础设施，英国《金融时报》称海湾能源设施遭袭、欧洲准备应对\"长期能源冲击\"，并评估配给与释放战略储备。能源、航运、航空与居民消费链条同时受挤压，市场从\"通胀回落+降息\"切换到\"油价冲击+增长放缓\"的复杂交易框架。", "<span class=\"briefing-number\">3</span><strong>科技与AI：监管、估值与情绪三重扰动。</strong>一方面，CNBC称Meta、Google正面临绕开30年法律保护的诉讼挑战，平台监管风险抬升；另一方面，FT指出投资者押注\"AI混乱\"，但历史表明大型 incumbents 可能受益。OpenAI连续并购引发外界对其战略边界的质疑，叠加利率与风险偏好走弱，AI主线短期更偏向基本面兑现与现金流质量筛选。"], macroEvents: [{ icon: "📊", iconBg: "#E8F5E9", title: "美国3月非农显著高于预期", fact: "美国3月新增非农就业<span class=\"data up\">17.8万</span>，高于预期的<span class=\"data up\">5.9万</span>；失业率为<span class=\"data up\">4.3%</span>，低于预期的<span class=\"data\">4.4%</span>。", source: "CNBC", url: "https://www.cnbc.com/2026/04/03/jobs-report-march-2026-.html", mappings: [{ type: "bull", text: "<strong>银行/顺周期</strong> — 就业韧性说明经济尚未快速失速，信用质量与经营环境短线更稳。" }, { type: "bear", text: "<strong>高估值科技</strong> — 强就业抬升\"更高更久\"利率预期，压缩AI、软件与长久期成长股估值。" }] }, { icon: "🛢️", iconBg: "#FFF3E0", title: "中东冲突升级推升能源与运输成本", fact: "特朗普称美军未来<span class=\"data\">两到三周</span>将对德黑兰\"极其强硬\"；FT称海湾能源设施遭袭，欧盟警告需准备\"长期能源冲击\"，并评估燃料配给及释放更多战略储备。", source: "CNBC / FT", url: "https://www.cnbc.com/2026/04/03/trump-iran-threats-un-resolution-blocked-strait-of-hormuz-f35-shot-down.html", mappings: [{ type: "bull", text: "<strong>能源/黄金</strong> — 地缘风险溢价上升，油气与避险资产受益。" }, { type: "bear", text: "<strong>航空/可选消费</strong> — 燃料与运输成本上行，居民实际购买力受挤压。" }] }, { icon: "📉", iconBg: "#FCE4EC", title: "风险偏好仍处极弱区间", fact: "恐惧贪婪指数报<span class=\"data\">19.31</span>，前值<span class=\"data\">15.31</span>，一周前<span class=\"data\">14.47</span>，一个月前<span class=\"data\">31.63</span>，仍处于<strong>极度恐惧</strong>区间。", source: "Y Daily整理", url: "https://www.cnbc.com/2026/04/03/stock-market-next-week-outlook-for-april-6-10-2026.html", mappings: [{ type: "bull", text: "<strong>防御与高股息</strong> — 在情绪极弱环境中，相对收益与资金承接更具优势。" }, { type: "bear", text: "<strong>小盘/高贝塔/加密</strong> — 流动性偏好下降时更易遭遇去风险化抛售。" }] }, { icon: "⚖️", iconBg: "#E3F2FD", title: "美国平台监管与诉讼风险升温", fact: "CNBC指出，Meta、Google 正遭遇绕开\"30年法律保护\"的诉讼挑战，互联网平台长期依赖的免责护城河出现松动迹象。", source: "CNBC", url: "https://www.cnbc.com/2026/04/03/meta-google-under-attack-court-cases-bypass-30-year-old-legal-shield.html", mappings: [{ type: "bull", text: "<strong>企业软件/ToB AI</strong> — 相比广告平台，面向企业的订阅与算力服务受监管冲击相对更小。" }, { type: "bear", text: "<strong>META/GOOGL</strong> — 内容责任、广告合规与平台治理成本可能同步上升。" }] }, { icon: "💳", iconBg: "#F3E5F5", title: "信用市场继续向高质量资产迁移", fact: "FT报道，今年以来投资者已从垃圾债撤出<span class=\"data down\">110亿美元</span>，在AI扰动与中东战争背景下，资金流向美国国债与投资级债券。", source: "FT", url: "https://www.ft.com/content/45c12697-4d59-4027-80b7-b0c565020d43", mappings: [{ type: "bull", text: "<strong>大型现金流科技</strong> — 资产负债表强、自由现金流高的龙头更符合\"质量偏好\"。" }, { type: "bear", text: "<strong>高杠杆成长</strong> — 融资成本与风险溢价上升，不利于依赖外部资本扩张的公司。" }] }], stocks: [{ name: "🟦 GOOGL", code: "GOOGL", news: [{ label: "📰 谷歌面临绕开平台免责护盾的诉讼挑战", content: "CNBC称，Meta、Google长期依赖的\"<span class=\"data\">30年</span>法律保护\"正被新一轮法院案件绕开，平台责任边界面临重估。", source: "CNBC", url: "https://www.cnbc.com/2026/04/03/meta-google-under-attack-court-cases-bypass-30-year-old-legal-shield.html" }], assessment: "<strong>影响偏空。</strong>对谷歌而言，短期不是业绩数字变化，而是<strong>监管折价</strong>可能扩大：搜索、YouTube与广告生态均受平台责任预期影响。若法律免责框架被持续侵蚀，合规、审核与诉讼成本上升，估值中枢承压。" }, { name: "🔵 META", code: "META", news: [{ label: "📰 Meta与Google同遭平台责任挑战", content: "CNBC报道，Meta、Google面临试图绕开长期互联网平台保护条款的案件，意味着内容与平台治理责任风险抬升。", source: "CNBC", url: "https://www.cnbc.com/2026/04/03/meta-google-under-attack-court-cases-bypass-30-year-old-legal-shield.html" }], assessment: "<strong>影响偏空。</strong>Meta当前核心矛盾从AI投入回报，延伸到<strong>监管与内容责任</strong>。若市场开始计入更高的法务与治理成本，其广告业务现金流优势虽在，但估值弹性会被压制。" }, { name: "🟣 MSFT", code: "MSFT", news: [{ label: "📰 AI交易逻辑被提醒回归\"赢家未必颠覆者\"", content: "FT指出，投资者正在押注AI混乱，但过去技术革命经验显示，成熟 incumbents 反而可能\"挺住并繁荣\"。", source: "FT", url: "https://www.ft.com/content/76ea6878-d11c-4118-ad98-3b361fcdbb01" }, { label: "📰 强非农推升利率，对长久期科技估值形成压制", content: "3月非农新增<span class=\"data up\">17.8万</span>高于预期<span class=\"data up\">5.9万</span>，市场对降息预期再度后移，美债收益率走高。", source: "CNBC", url: "https://www.cnbc.com/2026/04/03/jobs-report-march-2026-.html" }], assessment: "<strong>短空长多。</strong>短期受利率上行压制，但微软属于AI与云计算中的<strong>高质量现金流资产</strong>，且更符合FT所说\"成熟巨头可能受益\"的历史映射。在风险偏好偏弱阶段，其相对收益或优于高估值纯概念标的。" }, { name: "🟠 AMZN", code: "AMZN", news: [{ label: "📰 强就业与高油价并存，消费与物流面临双向扰动", content: "美国3月非农新增<span class=\"data up\">17.8万</span>、失业率<span class=\"data up\">4.3%</span>；与此同时中东冲突升级推高能源与运输不确定性。", source: "CNBC / FT", url: "https://www.cnbc.com/2026/04/03/jobs-report-march-2026-.html" }, { label: "📰 信用资金转向高质量资产", content: "FT称今年以来垃圾债资金流出<span class=\"data down\">110亿美元</span>，资金偏好转向国债与投资级债。", source: "FT", url: "https://www.ft.com/content/45c12697-4d59-4027-80b7-b0c565020d43" }], assessment: "<strong>偏中性。</strong>消费端受油价与通胀预期扰动，物流成本也可能抬升；但AWS与整体资产质量在避险环境中更受资金青睐。市场会在\"零售利润率压力\"与\"云业务防御性\"之间重新平衡。" }, { name: "🟢 NVDA", code: "NVDA", news: [{ label: "📰 AI革命历史经验提示龙头并非必然受损", content: "FT称，过去技术革命显示精明的 incumbents 可能\"挺住并繁荣\"，对AI产业链龙头的长期逻辑形成支撑。", source: "FT", url: "https://www.ft.com/content/76ea6878-d11c-4118-ad98-3b361fcdbb01" }, { label: "📰 宏观折现率上行压制算力高估值板块", content: "MarketWatch称，强于预期的就业报告发布后，国债收益率上行、股指期货与比特币回落，市场对Fed降息路径疑虑加深。", source: "MarketWatch", url: "https://www.marketwatch.com/story/stock-futures-and-bitcoin-slip-treasury-yields-climb-as-hot-jobs-report-raises-more-questions-about-fed-rate-cuts-921ff82f?mod=mw_rss_topstories" }], assessment: "<strong>短期承压，长期逻辑未坏。</strong>算力龙头最怕的是利率与拥挤交易同时逆风，而今天两者均不友好；但若AI资本开支没有实质回落，市场更可能从\"讲故事\"切回\"看订单与现金流\"，龙头相对中小票更有优势。" }, { name: "🟡 BTC", code: "BTC", news: [{ label: "📰 比特币随风险资产回落", content: "MarketWatch称，强非农后股指期货和比特币一同走弱，美债收益率上行，降息预期再受挑战。", source: "MarketWatch", url: "https://www.marketwatch.com/story/stock-futures-and-bitcoin-slip-treasury-yields-climb-as-hot-jobs-report-raises-more-questions-about-fed-rate-cuts-921ff82f?mod=mw_rss_topstories" }, { label: "📰 加密市场整体承压", content: "Yahoo Finance称，比特币及加密概念股跟随更广泛市场一起下滑；另有报道称 Riot Platforms 一季度出售了<span class=\"data\">3,778</span>枚比特币。", source: "Yahoo Finance / CryptoProwl", url: "https://news.google.com/rss/articles/CBMirgFBVV95cUxQcmRZa0d2WEZ4SDZ0YXowNk5iSG9MSThpNjBFOHp0V0hmb2dvVnpxbGpWWkliV1M1bG1rVjkxbUlSdzFMaWRjemVTenhGYk1TbW5IRHpfV3hnR0hwdk9SbURGdTY3SlZGM25ucmFUeEpPa3d4Njc3REtfQXZnc1NtY2dIZExaZ3BFc1FxbmxTSlgwUG5rQ2tWVUpQazd5eWluYnk1blI3dWp4UlI1Z3c?oc=5" }], assessment: "<strong>偏空。</strong>比特币当前同时受到<strong>实际利率上行</strong>与<strong>风险偏好恶化</strong>双杀。矿企抛售比特币也强化了市场对产业链现金流压力的担忧，短线更像风险资产而非避险资产。" }, { name: "⚪ ETH", code: "ETH", news: [{ label: "📰 加密板块跟随大市走弱", content: "Yahoo Finance称，比特币及加密股票与更广泛市场一同下跌；相关报道同时追问\"为何今日加密市场下跌\"。", source: "Yahoo Finance", url: "https://news.google.com/rss/articles/CBMif0FVX3lxTFBzaVFWaEt3Wl92aXBkUXF1MVBMZVlzZTF3Njh3YVZtTjU1N0gxSHBsYTJFRERadUU0TVBuLTJNeENVOC16bEtRNmN1aHltckFaVmtmekxNdVBKTGFFaV9IMzRCSlhmTUNYMlBJMjM1dmx4cDJuZkdNVnJJeDlkbnc?oc=5" }], assessment: "<strong>偏空且波动更大。</strong>在宏观流动性收紧预期与避险情绪升温时，以太坊通常较比特币呈现更高弹性下跌。若无新增链上催化，短期大概率继续跟随风险情绪。" }, { name: "🟨 黄金", code: "黄金", news: [{ label: "📰 中东冲突升级抬升避险需求", content: "特朗普威胁打击伊朗基础设施，FT称海湾能源设施遭袭、欧洲准备应对\"长期能源冲击\"，地缘风险显著升温。", source: "CNBC / FT", url: "https://www.ft.com/content/c860846e-e7e9-42cf-9c26-15ca516169b0" }], assessment: "<strong>中期偏多。</strong>黄金在\"战争溢价+增长担忧\"环境下具备配置价值，但短线会与美债收益率上行形成对冲。若能源冲击持续并拖累风险资产，黄金相对收益仍值得关注。" }, { name: "🟧 白银", code: "白银", news: [{ label: "📰 风险偏好恶化与宏观利率上行并存", content: "恐惧贪婪指数报<span class=\"data\">19.31</span>仍处极度恐惧；强非农后收益率继续走高，压制贵金属中的高波动品种表现。", source: "Y Daily整理 / CNBC", url: "https://www.cnbc.com/2026/04/03/jobs-report-march-2026-.html" }], assessment: "<strong>偏震荡。</strong>白银兼具贵金属与工业品属性，当前一边受益于避险，一边受制于实际利率与增长担忧，表现大概率弱于黄金、强于铜。" }, { name: "🟫 铜", code: "铜", news: [{ label: "📰 就业韧性与能源冲击带来方向拉扯", content: "美国新增就业<span class=\"data up\">17.8万</span>显示短期需求未坠落，但中东战争推升能源成本、FT称欧洲评估燃料配给与释放储备，全球工业预期承压。", source: "CNBC / FT", url: "https://www.ft.com/content/7d3a6810-b571-4730-aa35-f7bfcacdc242" }], assessment: "<strong>偏空震荡。</strong>铜对全球增长与制造业信心更敏感。当前宏观环境从\"软着陆\"转向\"滞胀担忧\"，对铜并不友好，除非后续出现更明确的财政或中国需求刺激信号。" }], alerts: [{ time: "下周初", event: "市场继续消化强于预期的3月非农与降息路径重估", target: "AAPL/MSFT/NVDA/AMZN" }, { time: "下周初", event: "关注伊朗战事是否进一步升级及霍尔木兹海峡通行风险", target: "黄金/BTC/原油敏感资产" }, { time: "下周", event: "关注美债收益率是否延续上行，对高估值科技形成二次压制", target: "NVDA/MSFT/GOOGL/META" }, { time: "下周", event: "平台责任相关诉讼进展可能继续影响互联网监管预期", target: "GOOGL/META" }, { time: "下周", event: "信用市场避险情绪若延续，资金或进一步偏向高质量龙头", target: "MSFT/AMZN/AAPL" }, { time: "下周", event: "加密资产需观察风险资产相关性是否继续增强", target: "BTC/ETH" }, { time: "未来数周", event: "特朗普称对伊朗将持续\"未来两到三周\"强硬行动，关注能源与运价链条外溢", target: "黄金/铜/全球科技估值" }, { time: "未来数周", event: "OpenAI连续并购引发行业战略分化讨论，关注AI应用与基础模型资本开支方向", target: "MSFT/GOOGL/AMZN/NVDA" }] },
  { id: "2026-04-02", date: "2026年4月2日", weekday: "周四", title: "特朗普伊朗讲话引发全球\"黑色星期四\"，特斯拉停产Model S/X，豆包Token突破120万亿", summary: "特朗普就伊朗战事强硬表态引发\"资产地震\"，原油暴涨7%、白银暴跌-6.86%、韩国KOSDAQ触发熔断、日经225重挫1300点。特斯拉停产Model S/X，FSD 14.3本周末推送。豆包大模型日均Token突破120万亿，阿里发布Wan2.7-Image。", tags: [{ text: "原油 +7%", type: "up" }, { text: "白银 -6.86%", type: "down" }, { text: "KOSDAQ 熔断", type: "down" }, { text: "日经 -1300点", type: "down" }, { text: "FSD 14.3 推送", type: "warn" }, { text: "豆包 120万亿Token", type: "warn" }], watchlist: ["腾讯 0700", "阿里 9988", "小鹏 XPEV", "美团 3690", "小米 1810", "MAG7", "台积电 TSM", "博通 AVGO", "BTC/ETH", "黄金/白银/铜"], focusAreas: "AI与大模型 · 半导体与算力 · 中美科技博弈 · 智能驾驶与机器人 · 宏观与流动性", timeRange: "2026.04.01 – 2026.04.02", generatedAt: "2026年4月2日 22:00 CST", briefings: ["<span class=\"briefing-number\">1</span><strong>特朗普伊朗战事讲话引发全球\"黑色星期四\"。</strong>宣称\"压倒性胜利\"但措辞强硬，讲话后30分钟以色列报告伊朗导弹来袭。原油暴涨 <span class=\"data up\">~7%</span>，白银暴跌 <span class=\"data down\">-6.86%</span>，韩国KOSDAQ <span class=\"data down\">触发熔断</span>，日经225重挫 <span class=\"data down\">~1,300点</span>。前日亚太\"大反攻\"涨幅一日回吐。", "<span class=\"briefing-number\">2</span><strong>特斯拉正式停产Model S/X，FSD 14.3本周末推送。</strong>战略重心全面转向Robotaxi与人形机器人。何小鹏同日发文\"跳过L3直指L4\"，中美智驾竞赛升温。", "<span class=\"briefing-number\">3</span><strong>AI大模型落地加速：豆包日均Token突破 <span class=\"data\">120万亿</span>（三月翻番）。</strong>阿里发布Wan2.7-Image图像大模型，腾讯混元3.0进入发布倒计时。"], macroEvents: [{ icon: "💥", iconBg: "#fef2f2", title: "特朗普伊朗讲话引发全球\"资产地震\"", fact: "北京时间4/2 09:00，特朗普就伊朗战事发表全美电视讲话，自称\"压倒性胜利\"，扬言\"两到三周内终结伊朗威胁\"。讲话后30分钟，以色列国防军声明监测到伊朗导弹来袭。布伦特原油暴涨约7%，白银单日暴跌-6.86%至17,621元/千克，韩国KOSDAQ触发熔断，KOSPI -4.21%，日经225重挫约1,300点。", mappings: [{ type: "bear", text: "<strong>全池</strong> — 地缘风险骤升，前日亚太大反攻涨幅一日回吐，风险偏好急剧恶化" }, { type: "bear", text: "<strong>黄金·白银</strong> — 白银-6.86%（保证金追缴连锁抛售），黄金同步承压" }, { type: "bull", text: "<strong>原油/能源</strong> — 布伦特暴涨约7%，中东冲突持续支撑油价" }], source: "新华社", url: "https://www.xinhuanet.com/20260402/2691dbc2be394e649988d588777f5185/c.html" }, { icon: "🏦", iconBg: "#eff6ff", title: "美联储4月维持利率不变概犘98.4%", fact: "CME FedWatch数据：美联储4月维持利率不变概犘98.4%，至6月累计降息25bp概率仅3.9%。地缘冲突引发的油价上行进一步强化通胀预期，降息窗口持续推后。", mappings: [{ type: "bear", text: "<strong>MAG7/科技股</strong> — 利率higher-for-longer，高久期资产估值继续承压" }, { type: "bear", text: "<strong>BTC·ETH</strong> — 流动性边际收紧不利风险资产" }], source: "同花顺", url: "https://stock.10jqka.com.cn/20260401/c675686389.shtml" }, { icon: "🛡️", iconBg: "#eff6ff", title: "美《芯片安全法案》推进，出口管制模式转型", fact: "3/26美国众议院外交事务委员会高票通过《芯片安全法案》(H.R.3447)，要求商务部对所有出口集成电路实施安全标准审查，标志芯片管制从\"许可管理\"向\"技术追踪\"转变。", mappings: [{ type: "bear", text: "<strong>台积电(TSM)·博通(AVGO)·英伟达(NVDA)</strong> — 出口合规成本上升，供应链不确定性持续" }, { type: "bear", text: "<strong>腾讯·阿里</strong> — 中长期算力获取可能受限" }], source: "南开大学CINGAI", url: "https://cingai.nankai.edu.cn/2026/0330/c34779a591704/page.htm" }], stocks: [{ name: "🏢 腾讯控股", code: "0700.HK", news: [{ label: "📰 混元3.0大模型4月发布倒计时", content: "混元3.0已进入内部测试，核心升级方向为\"强Agent\"，激活参数大幅降低、复杂推理与多轮对话能力显著提升。内部超 <span class=\"data\">900个业务</span> 已全面接入。" }], assessment: "混元3.0是本月最重要催化剂。从\"大模型\"到\"强Agent\"转型定位清晰，若发布效果超预期将驱动AI商业化估值重估。<strong>关注4月具体发布日期。</strong>" }, { name: "💻 阿里巴巴", code: "9988.HK / BABA", news: [{ label: "📰 通义发布CoPaw 1.0 + Wan2.7-Image（4/1）", content: "通义实验室4/1发布CoPaw 1.0和Wan2.7-Image图像生成编辑统一模型，解决AI生图\"标准脸\"问题，支持4K分辨率和 <span class=\"data\">4,000+字符</span> 渲染。" }, { label: "📰 第一上海维持买入", content: "AI+云推动收入增长，但闪购补贴导致盈利大幅下滑。" }], assessment: "Wan2.7-Image展现多模态AI持续迭代能力，但闪购补贴对利润率的侵蚀是短期核心矛盾。需关注AI云业务能否对冲电商补贴战的负面影响。" }, { name: "⚡ 特斯拉", code: "TSLA", news: [{ label: "📰 正式停产Model S/X（4/1）", content: "马斯克在X平台官宣停产两款旗舰车型，停止接受新车定制订单，仅售库存现车。" }, { label: "📰 FSD 14.3版本本周末推送", content: "马斯克确认FSD 14.3已在内部测试，预计本周末向用户推送。" }], assessment: "停产Model S/X标志战略重心全面转向Robotaxi+人形机器人。FSD 14.3若显著提升表现将强化Robotaxi叙事。<strong>短期受全球市场暴跌拖累。</strong>", source: "IT之家", url: "https://www.ithome.com/0/934/971.htm" }, { name: "🚗 小鹏集团", code: "XPEV / 9868.HK", news: [{ label: "📰 何小鹏：跳过L3直指L4（4/2）", content: "试驾特斯拉最新FSD后发文：\"真正的无人驾驶已近在眼前\"，明碮2026年中美将迎来全自动驾驶元年。" }, {
