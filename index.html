<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融资讯日报</title>
<meta name="description" content="每日定制化股票池资讯聚合与影响分析，投行分析师风格，克制精准数据导向。">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #64748b;
    --text-tertiary: #94a3b8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --green: #059669;
    --green-bg: #ecfdf5;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --orange: #d97706;
    --orange-bg: #fffbeb;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --code-bg: #f1f5f9;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Noto Sans SC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ============ Navigation ============ */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250,250,250,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .navbar-inner {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .navbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 16px;
  }

  .navbar-brand .logo-img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
  }

  .navbar-links {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .nav-link {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 8px;
    transition: all 0.15s;
    cursor: pointer;
  }

  .nav-link:hover, .nav-link.active {
    color: var(--accent);
    background: var(--accent-light);
  }

  /* ============ Layout ============ */
  .page {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .page-with-sidebar {
    display: flex;
    gap: 48px;
    align-items: flex-start;
  }

  .sidebar {
    position: sticky;
    top: 72px;
    width: 180px;
    flex-shrink: 0;
    padding-top: 8px;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-tertiary);
    margin-bottom: 12px;
  }

  .toc-list {
    list-style: none;
    padding: 0;
  }

  .toc-list li {
    margin-bottom: 2px;
  }

  .toc-link {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    cursor: pointer;
  }

  .toc-link:hover {
    color: var(--text);
    background: var(--code-bg);
  }

  .toc-link.active {
    color: var(--accent);
    background: var(--accent-light);
    border-left-color: var(--accent);
    font-weight: 600;
  }

  .main-content {
    flex: 1;
    min-width: 0;
    max-width: 760px;
  }

  /* ============ Breaking News ============ */
  .breaking-section {
    margin-bottom: 40px;
  }

  .breaking-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .breaking-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #fff;
    background: var(--red);
    padding: 4px 12px;
    border-radius: 4px;
    animation: pulse-badge 2s ease-in-out infinite;
  }

  .breaking-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes pulse-badge {
    0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.3); }
    50% { box-shadow: 0 0 0 6px rgba(220,38,38,0); }
  }

  .breaking-time {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .breaking-list {
    list-style: none;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }

  .breaking-item {
    display: flex;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .breaking-item:last-child {
    border-bottom: none;
  }

  .breaking-item:hover {
    background: var(--code-bg);
  }

  .breaking-item-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    white-space: nowrap;
    padding-top: 2px;
    min-width: 42px;
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .breaking-item-body {
    flex: 1;
    min-width: 0;
  }

  .breaking-item-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: 1px;
  }

  .breaking-item-tag.geo { background: #fef2f2; color: var(--red); }
  .breaking-item-tag.macro { background: #ecfdf5; color: var(--green); }
  .breaking-item-tag.ai { background: #eff6ff; color: var(--accent); }
  .breaking-item-tag.tech { background: #f5f3ff; color: #7c3aed; }
  .breaking-item-tag.crypto { background: var(--orange-bg); color: var(--orange); }

  .breaking-item-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .breaking-item-source {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }

  /* ============ Hero (Compact) ============ */
  .hero-compact {
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .hero-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .hero-compact-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .hero-tag {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 100px;
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  /* Latest issue inline header */
  .latest-header {
    margin-bottom: 32px;
  }

  .latest-header .date-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .latest-header h2 {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }

  .latest-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* Archive section */
  .archive-section {
    margin-top: 56px;
    padding-top: 32px;
    border-top: 2px solid var(--border);
  }

  /* ============ Issue List ============ */
  .issues-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .issues-header h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .issues-count {
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .issue-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
  }

  .issue-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .issue-card-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .issue-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.3px;
  }

  .issue-weekday {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .issue-card h3 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }

  .issue-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .issue-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .issue-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--code-bg);
    color: var(--text-secondary);
  }

  .issue-tag.up { background: var(--red-bg); color: var(--red); }
  .issue-tag.down { background: var(--green-bg); color: var(--green); }
  .issue-tag.warn { background: var(--orange-bg); color: var(--orange); }

  /* ============ Article Page ============ */
  .article-page { display: none; }
  .article-page.active { display: block; }
  .home-page.active { display: block; }
  .home-page { display: none; }

  .article-header {
    padding: 48px 0 32px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 24px;
    padding: 6px 0;
    cursor: pointer;
    transition: color 0.15s;
  }

  .back-link:hover { color: var(--accent); }

  .article-header .date-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 12px;
    border-radius: 100px;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .article-header h1 {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }

  .article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .article-meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .watchlist-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
  }

  .tag {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: var(--radius-xs);
    background: var(--code-bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  /* Article body */
  .article-body section { margin-bottom: 48px; }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Briefing cards */
  .briefing-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 12px;
    transition: box-shadow 0.2s;
  }

  .briefing-card:hover { box-shadow: var(--shadow-sm); }

  .briefing-card p { font-size: 15px; line-height: 1.7; }

  .briefing-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: var(--radius-xs);
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    margin-right: 10px;
    flex-shrink: 0;
    vertical-align: middle;
  }

  /* Macro event */
  .macro-event {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .macro-event h3 {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 17px;
    font-weight: 700;
  }

  .event-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    font-size: 16px;
    flex-shrink: 0;
  }

  .fact-block {
    background: var(--code-bg);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1.75;
  }

  .fact-block .label, .assessment .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .mapping-list {
    list-style: none;
    padding: 0;
  }

  .mapping-list li {
    padding: 8px 0;
    font-size: 14px;
    line-height: 1.65;
    border-bottom: 1px solid var(--border);
  }

  .mapping-list li:last-child { border-bottom: none; }

  .badge-bull {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--green-bg);
    color: var(--green);
    margin-right: 6px;
  }

  .badge-bear {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--red-bg);
    color: var(--red);
    margin-right: 6px;
  }

  /* Stock cards */
  .stock-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .stock-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 0;
  }

  .stock-header h3 { margin: 0; font-size: 18px; font-weight: 700; }

  .stock-code {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--code-bg);
    padding: 4px 10px;
    border-radius: var(--radius-xs);
    font-family: "SF Mono", "Fira Code", monospace;
  }

  .stock-body { padding: 16px 24px 24px; }

  .news-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .news-item:last-of-type { border-bottom: none; }

  .news-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .news-content {
    font-size: 14px;
    line-height: 1.7;
  }

  .news-content ul {
    padding-left: 18px;
    margin-top: 6px;
  }

  .news-content li {
    font-size: 14px;
    line-height: 1.65;
    margin-bottom: 4px;
  }

  .assessment {
    margin-top: 16px;
    padding: 16px 20px;
    background: var(--orange-bg);
    border-radius: var(--radius-sm);
    font-size: 14px;
    line-height: 1.7;
    border-left: 3px solid var(--orange);
  }

  .assessment .label { color: var(--orange); }

  /* Alert table */
  .alert-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .alert-table thead { background: var(--code-bg); }

  .alert-table th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
  }

  .alert-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.6;
  }

  .alert-table tr:last-child td { border-bottom: none; }

  .alert-table .time-cell {
    font-weight: 600;
    white-space: nowrap;
    color: var(--accent);
    font-size: 13px;
  }

  .alert-table .target-cell {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Data */
  .data {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 13px;
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .up { color: var(--red); }
  .down { color: var(--green); }

  /* Disclaimer */
  .disclaimer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  .generated-at {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-tertiary);
    font-style: italic;
  }

  /* Footer */
  .site-footer {
    max-width: 1160px;
    margin: 0 auto;
    padding: 32px 32px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-tertiary);
    text-align: center;
    line-height: 1.8;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-secondary);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
  .empty-state p { font-size: 14px; }

  /* Responsive */
  @media (max-width: 860px) {
    .sidebar { display: none; }
    .page-with-sidebar { gap: 0; }
    .main-content { max-width: 100%; }
    .page { padding: 0 16px; }
    .navbar-inner { padding: 0 16px; }
  }

  @media (max-width: 640px) {
    .hero-compact { flex-direction: column; align-items: flex-start; }
    .latest-header h2 { font-size: 20px; }
    .article-header h1 { font-size: 26px; }
    .article-meta { flex-direction: column; gap: 8px; }
    .stock-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .navbar-links { gap: 0; }
    .issue-card { padding: 20px; }
  }
</style>
</head>
<body>

<!-- ============ Navigation ============ -->
<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="#" onclick="showHome(); return false;">
      <img class="logo-img" src="favicon.png" alt="Y">
      <span>金融资讯日报</span>
    </a>
    <div class="navbar-links">
      <a class="nav-link active" id="nav-home" onclick="showHome()">首页</a>
      <a class="nav-link" id="nav-about" onclick="showAbout()">关于</a>
    </div>
  </div>
</nav>

<!-- ============ Home Page ============ -->
<div class="home-page active" id="homePage">
  <div class="page">
    <!-- Compact Hero -->
    <div class="hero-compact">
      <p class="hero-desc">聚焦美股港股 AI 科技互联网头部企业，每日自动检索宏观与个股动态，降噪聚合后输出投行风格研报。</p>
      <div class="hero-compact-tags">
        <span class="hero-tag">腾讯</span>
        <span class="hero-tag">阿里</span>
        <span class="hero-tag">小鹏</span>
        <span class="hero-tag">美团</span>
        <span class="hero-tag">MAG7</span>
        <span class="hero-tag">台积电</span>
        <span class="hero-tag">博通</span>
      </div>
    </div>

    <div class="page-with-sidebar">
      <!-- Sidebar TOC -->
      <aside class="sidebar" id="homeSidebar">

// ============ Rendering ============

function renderBreakingNews() {
  const container = document.getElementById('breakingSection');
  const tocBreaking = document.getElementById('toc-breaking');

  if (!breakingNews || breakingNews.length === 0) {
    container.style.display = 'none';
    if (tocBreaking) tocBreaking.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  if (tocBreaking) tocBreaking.style.display = 'block';

  container.innerHTML = `
    <div id="sec-breaking">
      <div class="breaking-header">
        <span class="breaking-badge"><span class="dot"></span>BREAKING</span>
        <span class="breaking-time">最近更新：${breakingDate}</span>
      </div>
      <ul class="breaking-list">
        ${breakingNews.map(item => `
          <li class="breaking-item">
            <span class="breaking-item-time">${item.time}</span>
            <div class="breaking-item-body">
              <div class="breaking-item-text">
                <span class="breaking-item-tag ${item.tag}">${item.tagText}</span>${item.text}
              </div>
              <div class="breaking-item-source">${item.source}</div>
            </div>
          </li>
        `).join('')}
      </ul>
    </div>`;
}

function renderLatestIssue() {
  if (issues.length === 0) return;
  const issue = issues[0]; // latest

  // Header
  document.getElementById('latestIssueHeader').innerHTML = `
    <div class="latest-header">
      <div class="date-badge">${issue.date} · ${issue.weekday}</div>
      <h2>${issue.title}</h2>
      <div class="latest-meta">
        <span>⏱ ${issue.timeRange}</span>
        <span>📋 ${issue.focusAreas}</span>
      </div>
    </div>`;

  // Body — reuse renderArticleBody
  document.getElementById('latestIssueBody').innerHTML = renderArticleBody(issue);
}

function renderArticleBody(issue) {
  let html = '';

  // Briefings
  html += `<section id="sec-briefing"><div class="section-label">核心情报摘要</div>`;
  issue.briefings.forEach(b => {
    html += `<div class="briefing-card"><p>${b}</p></div>`;
  });
  html += `</section>`;

  // Macro Events
  html += `<section id="sec-macro"><div class="section-label">宏观与地缘风向</div>`;
  issue.macroEvents.forEach(e => {
    html += `
      <div class="macro-event">
        <h3><span class="event-icon" style="background:${e.iconBg}">${e.icon}</span><span>${e.title}</span></h3>
        <div class="fact-block"><div class="label">核心事实</div>${e.fact}</div>
        <ul class="mapping-list">
          ${e.mappings.map(m => `<li><span class="badge-${m.type === 'bull' ? 'bull' : 'bear'}">${m.type === 'bull' ? '利好' : '利空'}</span>${m.text}</li>`).join('')}
        </ul>
      </div>`;
  });
  html += `</section>`;

  // Stocks
  html += `<section id="sec-stocks"><div class="section-label">标的精准追踪</div>`;
  issue.stocks.forEach(s => {
    html += `
      <div class="stock-card">
        <div class="stock-header">
          <h3>${s.name}</h3>
          <span class="stock-code">${s.code}</span>
        </div>
        <div class="stock-body">
          ${s.news.map(n => `
            <div class="news-item">
              <div class="news-label">${n.label}</div>
              <div class="news-content">${n.content}</div>
            </div>
          `).join('')}
          <div class="assessment">
            <div class="label">⚡ 影响评估</div>
            ${s.assessment}
          </div>
        </div>
      </div>`;
  });
  html += `</section>`;

  // Alerts
  html += `<section id="sec-alerts"><div class="section-label">前瞻预警</div>
    <table class="alert-table">
      <thead><tr><th>时间</th><th>事件</th><th>关联标的</th></tr></thead>
      <tbody>
        ${issue.alerts.map(a => `<tr><td class="time-cell">${a.time}</td><td>${a.event}</td><td class="target-cell">${a.target}</td></tr>`).join('')}
      </tbody>
    </table>
  </section>`;

  // Disclaimer
  html += `
    <div class="disclaimer">
      <strong>⚖️ 免责声明：</strong>本报告仅提供资讯聚合与逻辑推演，不构成任何买入、卖出或持有的投资建议。所有信息来源于公开渠道，投资者应独立判断并自行承担风险。
      <div class="generated-at">报告生成时间：${issue.generatedAt}</div>
    </div>`;

  return html;
}

function renderIssueList() {
  const list = document.getElementById('issueList');
  const count = document.getElementById('issueCount');
  const archive = document.getElementById('archiveSection');
  const tocArchive = document.getElementById('toc-archive');

  // Archive shows only past issues (skip the latest which is shown inline)
  const pastIssues = issues.slice(1);

  if (pastIssues.length === 0) {
    archive.style.display = 'none';
    if (tocArchive) tocArchive.style.display = 'none';
    return;
  }

  archive.style.display = 'block';
  if (tocArchive) tocArchive.style.display = 'block';
  count.textContent = `共 ${pastIssues.length} 期`;

  list.innerHTML = pastIssues.map(issue => `
    <div class="issue-card" onclick="showArticle('${issue.id}')">
      <div class="issue-card-top">
        <span class="issue-date">${issue.date}</span>
        <span class="issue-weekday">${issue.weekday}</span>
      </div>
      <h3>${issue.title}</h3>
      <p class="issue-summary">${issue.summary}</p>
      <div class="issue-tags">
        ${issue.tags.map(t => `<span class="issue-tag ${t.type}">${t.text}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function renderArticle(issueId) {
  const issue = issues.find(i => i.id === issueId);
  if (!issue) return;

  // Header
  document.getElementById('articleHeaderContent').innerHTML = `
    <div class="date-badge">${issue.date} · ${issue.weekday}</div>
    <h1>${issue.title}</h1>
    <div class="article-meta">
      <span class="article-meta-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        ${issue.timeRange}
      </span>
      <span class="article-meta-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        ${issue.focusAreas}
      </span>
    </div>
    <div class="watchlist-tags">
      ${issue.watchlist.map(w => `<span class="tag">${w}</span>`).join('')}
    </div>
  `;

  // Body
  document.getElementById('articleBody').innerHTML = renderArticleBody(issue);
}

// ============ Navigation ============

function showHome() {
  document.getElementById('homePage').classList.add('active');
  document.getElementById('articlePage').classList.remove('active');
  document.getElementById('nav-home').classList.add('active');
  window.scrollTo(0, 0);
  history.pushState(null, '', '#');
}

function showArticle(id) {
  renderArticle(id);
  document.getElementById('homePage').classList.remove('active');
  document.getElementById('articlePage').classList.add('active');
  document.getElementById('nav-home').classList.remove('active');
  window.scrollTo(0, 0);
  history.pushState(null, '', '#' + id);
}

function showAbout() {
  alert('金融资讯日报\n\n每日自动聚合定制股票池相关的宏观与个股资讯，\n经降噪与关联分析后生成投行风格研报。\n\n数据来源：公开渠道\n更新频率：每日 22:00');
}

// Handle back button
window.addEventListener('popstate', () => {
  const hash = location.hash.replace('#', '');
  if (hash && issues.find(i => i.id === hash)) {
    showArticle(hash);
  } else {
    showHome();
  }
});

// ============ Init ============
renderBreakingNews();
renderLatestIssue();
renderIssueList();

// TOC scroll spy
function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) {
    const top = el.getBoundingClientRect().top + window.scrollY - 80;
    window.scrollTo({ top, behavior: 'smooth' });
  }
}

function updateTocHighlight() {
  const sections = ['sec-breaking', 'sec-briefing', 'sec-macro', 'sec-stocks', 'sec-alerts', 'sec-archive'];
  const links = document.querySelectorAll('.toc-link');
  let current = sections[0];

  for (const id of sections) {
    const el = document.getElementById(id);
    if (el && el.offsetParent !== null) {
      const rect = el.getBoundingClientRect();
      if (rect.top <= 120) current = id;
    }
  }

  links.forEach(link => {
    link.classList.toggle('active', link.dataset.section === current);
  });
}

window.addEventListener('scroll', updateTocHighlight, { passive: true });

// Check hash on load
const initHash = location.hash.replace('#', '');
if (initHash && issues.find(i => i.id === initHash)) {
  showArticle(initHash);
}
</script>
