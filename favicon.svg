<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Letter Y - main strokes -->
  <!-- Left arm -->
  <path d="M 128 100 L 256 260" stroke="url(#g1)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M 384 100 L 256 260" stroke="url(#g1)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Stem -->
  <path d="M 256 260 L 256 420" stroke="url(#g1)" stroke-width="36" stroke-linecap="round" fill="none"/>

  <!-- AI Neural network nodes on left arm -->
  <circle cx="160" cy="144" r="6" fill="#60a5fa" opacity="0.9"/>
  <circle cx="192" cy="180" r="5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="140" cy="180" r="4" fill="#38bdf8" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="160" y1="144" x2="192" y2="180" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <line x1="160" y1="144" x2="140" y2="180" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <line x1="140" y1="180" x2="192" y2="180" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>

  <!-- AI Neural network nodes on right arm -->
  <circle cx="352" cy="144" r="6" fill="#06b6d4" opacity="0.9"/>
  <circle cx="320" cy="180" r="5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="372" cy="180" r="4" fill="#06b6d4" opacity="0.6"/>
  <!-- Connection lines -->
  <line x1="352" y1="144" x2="320" y2="180" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
  <line x1="352" y1="144" x2="372" y2="180" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="320" y1="180" x2="372" y2="180" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>

  <!-- Center junction glow -->
  <circle cx="256" cy="260" r="12" fill="#3b82f6" opacity="0.3"/>
  <circle cx="256" cy="260" r="7" fill="#60a5fa" opacity="0.6"/>

  <!-- Bottom node cluster (data/signal) -->
  <circle cx="256" cy="420" r="8" fill="#06b6d4" opacity="0.4"/>
  <circle cx="236" cy="380" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="276" cy="380" r="4" fill="#38bdf8" opacity="0.5"/>
  <line x1="256" y1="420" x2="236" y2="380" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="420" x2="276" y2="380" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>

  <!-- Floating particles (ambient intelligence feel) -->
  <circle cx="100" cy="260" r="3" fill="#60a5fa" opacity="0.3"/>
  <circle cx="412" cy="260" r="3" fill="#06b6d4" opacity="0.3"/>
  <circle cx="180" cy="340" r="2.5" fill="#38bdf8" opacity="0.25"/>
  <circle cx="332" cy="340" r="2.5" fill="#22d3ee" opacity="0.25"/>
  <circle cx="200" cy="100" r="2" fill="#818cf8" opacity="0.2"/>
  <circle cx="312" cy="100" r="2" fill="#818cf8" opacity="0.2"/>
</svg>
