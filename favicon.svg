<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Serif Y — Playfair-inspired with stroke contrast -->
  <!-- Thin-to-thick strokes mimicking high-contrast serif italic -->
  <!-- Left arm (thin stroke, italic lean) -->
  <path d="M 120 88 Q 160 88 200 160 Q 230 210 256 230" 
        stroke="url(#g1)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Right arm (thick stroke, italic lean) -->
  <path d="M 380 88 Q 348 88 310 160 Q 280 210 256 230" 
        stroke="url(#g1)" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- Stem (medium, slightly italic) -->
  <path d="M 256 230 Q 252 320 248 420" 
        stroke="url(#g1)" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- Serifs — small horizontal strokes at terminals -->
  <!-- Left arm top serif -->
  <path d="M 108 88 L 138 88" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Right arm top serif -->
  <path d="M 368 88 L 396 88" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Bottom serif -->
  <path d="M 232 420 L 264 420" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Neural network nodes — left side -->
  <circle cx="148" cy="128" r="5.5" fill="#60a5fa" opacity="0.85"/>
  <circle cx="126" cy="164" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="176" cy="158" r="4.5" fill="#60a5fa" opacity="0.65"/>
  <line x1="148" y1="128" x2="126" y2="164" stroke="#38bdf8" stroke-width="1.2" opacity="0.4"/>
  <line x1="148" y1="128" x2="176" y2="158" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="126" y1="164" x2="176" y2="158" stroke="#60a5fa" stroke-width="0.8" opacity="0.25"/>

  <!-- Neural network nodes — right side -->
  <circle cx="356" cy="128" r="5.5" fill="#06b6d4" opacity="0.85"/>
  <circle cx="378" cy="164" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="328" cy="158" r="4.5" fill="#22d3ee" opacity="0.65"/>
  <line x1="356" y1="128" x2="378" y2="164" stroke="#06b6d4" stroke-width="1.2" opacity="0.4"/>
  <line x1="356" y1="128" x2="328" y2="158" stroke="#22d3ee" stroke-width="1.2" opacity="0.4"/>
  <line x1="378" y1="164" x2="328" y2="158" stroke="#22d3ee" stroke-width="0.8" opacity="0.25"/>

  <!-- Junction glow -->
  <circle cx="256" cy="230" r="12" fill="#3b82f6" opacity="0.2"/>
  <circle cx="256" cy="230" r="6" fill="#60a5fa" opacity="0.5"/>

  <!-- Stem side data nodes -->
  <circle cx="228" cy="310" r="3.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="272" cy="355" r="3.5" fill="#38bdf8" opacity="0.4"/>
  <line x1="252" y1="300" x2="228" y2="310" stroke="#38bdf8" stroke-width="0.8" opacity="0.25"/>
  <line x1="250" y1="345" x2="272" y2="355" stroke="#38bdf8" stroke-width="0.8" opacity="0.25"/>

  <!-- Ambient particles -->
  <circle cx="96" cy="256" r="2" fill="#60a5fa" opacity="0.2"/>
  <circle cx="416" cy="256" r="2" fill="#06b6d4" opacity="0.2"/>
</svg>
