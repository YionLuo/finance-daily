<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Letter Y — arms shorter, stem longer -->
  <!-- Left arm: from top-left down to center junction -->
  <path d="M 136 96 L 256 220" stroke="url(#g1)" stroke-width="38" stroke-linecap="round" fill="none"/>
  <!-- Right arm: from top-right down to center junction -->
  <path d="M 376 96 L 256 220" stroke="url(#g1)" stroke-width="38" stroke-linecap="round" fill="none"/>
  <!-- Stem: from junction straight down (long) -->
  <path d="M 256 220 L 256 416" stroke="url(#g1)" stroke-width="38" stroke-linecap="round" fill="none"/>

  <!-- Neural network nodes — left arm -->
  <circle cx="166" cy="130" r="6" fill="#60a5fa" opacity="0.9"/>
  <circle cx="142" cy="168" r="4.5" fill="#38bdf8" opacity="0.65"/>
  <circle cx="196" cy="162" r="5" fill="#60a5fa" opacity="0.7"/>
  <line x1="166" y1="130" x2="142" y2="168" stroke="#38bdf8" stroke-width="1.5" opacity="0.45"/>
  <line x1="166" y1="130" x2="196" y2="162" stroke="#60a5fa" stroke-width="1.5" opacity="0.45"/>
  <line x1="142" y1="168" x2="196" y2="162" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>

  <!-- Neural network nodes — right arm -->
  <circle cx="346" cy="130" r="6" fill="#06b6d4" opacity="0.9"/>
  <circle cx="370" cy="168" r="4.5" fill="#06b6d4" opacity="0.65"/>
  <circle cx="316" cy="162" r="5" fill="#22d3ee" opacity="0.7"/>
  <line x1="346" y1="130" x2="370" y2="168" stroke="#06b6d4" stroke-width="1.5" opacity="0.45"/>
  <line x1="346" y1="130" x2="316" y2="162" stroke="#22d3ee" stroke-width="1.5" opacity="0.45"/>
  <line x1="370" y1="168" x2="316" y2="162" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>

  <!-- Center junction glow -->
  <circle cx="256" cy="220" r="14" fill="#3b82f6" opacity="0.25"/>
  <circle cx="256" cy="220" r="8" fill="#60a5fa" opacity="0.55"/>

  <!-- Stem side nodes (data flow) -->
  <circle cx="232" cy="300" r="4" fill="#38bdf8" opacity="0.45"/>
  <circle cx="280" cy="340" r="4" fill="#38bdf8" opacity="0.45"/>
  <circle cx="232" cy="380" r="3.5" fill="#06b6d4" opacity="0.35"/>
  <line x1="256" y1="290" x2="232" y2="300" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="330" x2="280" y2="340" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="370" x2="232" y2="380" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>

  <!-- Bottom terminal glow -->
  <circle cx="256" cy="416" r="10" fill="#06b6d4" opacity="0.3"/>

  <!-- Ambient particles -->
  <circle cx="104" cy="240" r="2.5" fill="#60a5fa" opacity="0.25"/>
  <circle cx="408" cy="240" r="2.5" fill="#06b6d4" opacity="0.25"/>
  <circle cx="180" cy="420" r="2" fill="#818cf8" opacity="0.2"/>
  <circle cx="332" cy="420" r="2" fill="#818cf8" opacity="0.2"/>
</svg>
