name: Breaking News Update

on:
  schedule:
    # Every hour at :05
    - cron: '5 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  update-breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Breaking News update
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://api.deepseek.com"
          LLM_MODEL: "deepseek-chat"
          TZ: Asia/Shanghai
        run: python scripts/update_breaking.py

      - name: Commit and push
        run: |
          git config user.name "Y Daily Bot"
          git config user.email "bot@yion.me"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update breaking news $(date +%Y-%m-%d\ %H:%M\ CST)"
            git pull --rebase origin main
            git push
          fi
