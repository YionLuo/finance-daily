name: Deep Research Report

on:
  schedule:
    # 22:00 CST = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  generate-deep-research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Deep Research Report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://tokens.devcloud.woa.com/v1"
          LLM_MODEL: "gpt-5.4-mini"
          WRITER_MODEL: "gpt-5.4"
          TZ: Asia/Shanghai
        run: python scripts/update_deep_research.py

      - name: Commit and push
        run: |
          git config user.name "Y Daily Bot"
          git config user.email "bot@yion.me"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: deep research report $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
